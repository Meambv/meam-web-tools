<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEAM Web Tools</title>
  <style>
    :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --accent:#22c55e; }
    body { margin:0; font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif; background:radial-gradient(circle at top,#1f2937,#0b1020 60%); color:var(--text); min-height:100vh; display:grid; place-items:center; }
    main { background:rgba(17,24,39,.85); border:1px solid #334155; border-radius:14px; padding:28px; width:min(92vw,760px); box-shadow:0 20px 60px rgba(0,0,0,.35); }
    h1 { margin:0 0 10px; font-size:clamp(1.5rem,3vw,2.4rem); }
    p { margin:0; color:#cbd5e1; line-height:1.5; }
    .dot { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1><span class="dot">●</span> MEAM Web Tools</h1>
    <p>Site bootstrap complete. GitHub Pages is connected to <strong>meam-web-tools.org</strong>.</p>
  </main>
</body>
</html>
